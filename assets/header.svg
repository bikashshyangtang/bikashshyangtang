<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Bikash Shyangtang — Backend Developer, C# / .NET, Vancouver BC">
  <title>Bikash Shyangtang — Backend Developer · C# / .NET</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="0.55" stop-color="#120f2a"/>
      <stop offset="1" stop-color="#1d1245"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#512bd4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#512bd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4c8ff"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; }
      .k { fill: #b39dff; } .t { fill: #7dd3fc; } .s { fill: #a5e3b5; } .c { fill: #6b7280; } .p { fill: #c9d1d9; } .n { fill: #fbbf24; }
      .code text { white-space: pre; }
      .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
      .line { opacity: 0; animation: type .35s ease-out forwards; }
      .cursor { animation: blink 1.05s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 82px 74px; }
      .breathe { animation: breathe 7s ease-in-out infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes type { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: 0; transform: scale(2.3); } }
      @keyframes breathe { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .rise, .line { animation: none; opacity: 1; }
        .cursor, .pulse, .breathe { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <ellipse class="breathe" cx="1010" cy="70" rx="420" ry="300" fill="url(#glow)"/>
    <ellipse cx="120" cy="400" rx="340" ry="200" fill="url(#glow2)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- left: identity -->
  <g class="sans">
    <g class="rise" style="animation-delay:.05s">
      <rect x="64" y="56" width="326" height="36" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#2dd4bf" stroke-opacity="0.35"/>
      <circle class="pulse" cx="82" cy="74" r="5" fill="#2dd4bf"/>
      <circle cx="82" cy="74" r="5" fill="#2dd4bf"/>
      <text x="98" y="79.5" font-size="15" fill="#c9d1d9" letter-spacing="0.2">Open to developer roles · Vancouver, BC</text>
    </g>
    <text class="rise" style="animation-delay:.15s" x="62" y="168" font-size="70" font-weight="800" fill="url(#nameFill)" letter-spacing="-1.5">Bikash</text>
    <text class="rise" style="animation-delay:.25s" x="62" y="240" font-size="70" font-weight="800" fill="url(#nameFill)" letter-spacing="-1.5">Shyangtang</text>
    <text class="rise" style="animation-delay:.4s" x="65" y="290" font-size="25" font-weight="600" fill="#b39dff">Backend Developer · C# / .NET</text>
    <text class="rise" style="animation-delay:.5s" x="65" y="326" font-size="18" fill="#8b949e">Fintech-grade APIs — now with LLMs inside them.</text>
  </g>

  <!-- right: code card -->
  <g class="rise" style="animation-delay:.3s">
    <rect x="640" y="40" width="500" height="300" rx="16" fill="#0d1117" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.10"/>
    <path d="M656 40h468a16 16 0 0 1 16 16v28H640V56a16 16 0 0 1 16-16z" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="664" cy="62" r="6" fill="#ff5f57"/>
    <circle cx="684" cy="62" r="6" fill="#febc2e"/>
    <circle cx="704" cy="62" r="6" fill="#28c840"/>
    <text class="mono" x="890" y="67" font-size="13.5" fill="#8b949e" text-anchor="middle">Developer.cs</text>
    <line x1="640" y1="84" x2="1140" y2="84" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>

  <g class="mono code" font-size="18">
    <text xml:space="preserve" class="line" style="animation-delay:.70s" x="666" y="118"><tspan class="k">var</tspan><tspan class="p"> me = </tspan><tspan class="k">new</tspan><tspan class="t"> Developer</tspan></text>
    <text xml:space="preserve" class="line" style="animation-delay:.90s" x="666" y="146"><tspan class="p">{</tspan></text>
    <text xml:space="preserve" class="line" style="animation-delay:1.10s" x="666" y="174"><tspan class="p">    Stack    = </tspan><tspan class="s">".NET / C#"</tspan><tspan class="p">,</tspan></text>
    <text xml:space="preserve" class="line" style="animation-delay:1.30s" x="666" y="202"><tspan class="p">    Years    = </tspan><tspan class="n">2</tspan><tspan class="p">,  </tspan><tspan class="c">// fintech, prod</tspan></text>
    <text xml:space="preserve" class="line" style="animation-delay:1.50s" x="666" y="230"><tspan class="p">    Building = </tspan><tspan class="s">"AI Travel Planner"</tspan><tspan class="p">,</tspan></text>
    <text xml:space="preserve" class="line" style="animation-delay:1.70s" x="666" y="258"><tspan class="p">    Studying = </tspan><tspan class="s">"MCS @ FDU"</tspan><tspan class="p">,</tspan></text>
    <text xml:space="preserve" class="line" style="animation-delay:1.90s" x="666" y="286"><tspan class="p">    Hireable = </tspan><tspan class="k">true</tspan></text>
    <text xml:space="preserve" class="line" style="animation-delay:2.10s" x="666" y="314"><tspan class="p">};</tspan></text>
  </g>
  <g class="line" style="animation-delay:2.10s"><rect class="cursor" x="694" y="299" width="10" height="20" rx="1.5" fill="#b39dff"/></g>
</svg>
