<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="TravelPlannerWithAI: ASP.NET Core Clean Architecture API using Semantic Kernel, Groq, Foursquare and SQL Server">
  <title>TravelPlannerWithAI — architecture</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#151131"/>
    </linearGradient>
    <radialGradient id="pglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#512bd4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#512bd4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pdots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b39dff"/>
    </marker>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2dd4bf"/>
    </marker>
    <clipPath id="pcard"><rect width="1200" height="470" rx="24"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Inter, Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; white-space: pre; }
      .flow { stroke-dasharray: 6 7; animation: flow 1.4s linear infinite; }
      .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
      @keyframes flow { to { stroke-dashoffset: -26; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } .rise { animation: none; opacity: 1; } }
      .box { fill: #0d1117; stroke-opacity: .55; stroke-width: 1.4; }
      .ttl { font-size: 19px; font-weight: 700; fill: #f0f6fc; }
      .sub { font-size: 13.5px; fill: #8b949e; }
      .chip { fill: #ffffff; fill-opacity: .05; stroke: #ffffff; stroke-opacity: .12; }
      .chipt { font-size: 13.5px; fill: #c9d1d9; }
    </style>
  </defs>

  <g clip-path="url(#pcard)">
    <rect width="1200" height="470" fill="url(#pbg)"/>
    <rect width="1200" height="470" fill="url(#pdots)"/>
    <ellipse cx="860" cy="200" rx="420" ry="260" fill="url(#pglow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- left column -->
  <g class="sans">
    <text class="mono" x="56" y="70" font-size="13" fill="#b39dff" letter-spacing="2.5">FEATURED PROJECT</text>
    <text x="54" y="116" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.8">TravelPlannerWithAI</text>
    <text x="56" y="156" font-size="17.5" fill="#c9d1d9">An ASP.NET Core API that plans and refines</text>
    <text x="56" y="181" font-size="17.5" fill="#c9d1d9">multi-day trips with an LLM, grounded in</text>
    <text x="56" y="206" font-size="17.5" fill="#c9d1d9">real places data.</text>

    <g class="mono" font-size="14">
      <rect x="56" y="232" width="380" height="122" rx="12" fill="#0d1117" fill-opacity=".8" stroke="#ffffff" stroke-opacity=".08"/>
      <text xml:space="preserve" x="76" y="262"><tspan fill="#2dd4bf">POST</tspan><tspan fill="#c9d1d9">  /api/trips</tspan></text>
      <text xml:space="preserve" x="76" y="287"><tspan fill="#7dd3fc">GET </tspan><tspan fill="#c9d1d9">  /api/trips</tspan></text>
      <text xml:space="preserve" x="76" y="312"><tspan fill="#7dd3fc">GET </tspan><tspan fill="#c9d1d9">  /api/trips/{id}</tspan></text>
      <text xml:space="preserve" x="76" y="337"><tspan fill="#2dd4bf">POST</tspan><tspan fill="#c9d1d9">  /api/trips/{id}/refine</tspan></text>
    </g>

    <!-- chips -->
    <g>
      <rect class="chip" x="56" y="380" width="78" height="30" rx="15"/><text class="chipt" x="95" y="400" text-anchor="middle">.NET 10</text>
      <rect class="chip" x="142" y="380" width="134" height="30" rx="15"/><text class="chipt" x="209" y="400" text-anchor="middle">Semantic Kernel</text>
      <rect class="chip" x="284" y="380" width="70" height="30" rx="15"/><text class="chipt" x="319" y="400" text-anchor="middle">EF Core</text>
      <rect class="chip" x="362" y="380" width="74" height="30" rx="15"/><text class="chipt" x="399" y="400" text-anchor="middle">Groq</text>
      <rect class="chip" x="56" y="418" width="138" height="30" rx="15"/><text class="chipt" x="125" y="438" text-anchor="middle">FluentValidation</text>
      <rect class="chip" x="202" y="418" width="70" height="30" rx="15"/><text class="chipt" x="237" y="438" text-anchor="middle">Scalar</text>
      <rect class="chip" x="280" y="418" width="156" height="30" rx="15"/><text class="chipt" x="358" y="438" text-anchor="middle">Clean Architecture</text>
    </g>
  </g>

  <!-- diagram -->
  <g class="sans">
    <text class="mono" x="520" y="70" font-size="13" fill="#7d8590" letter-spacing="2.5">HOW IT FITS TOGETHER</text>

    <!-- arrows (behind boxes) -->
    <line class="flow" x1="692" y1="140" x2="726" y2="140" stroke="#b39dff" stroke-width="2" marker-end="url(#arr)"/>
    <line class="flow" x1="918" y1="140" x2="952" y2="140" stroke="#b39dff" stroke-width="2" marker-end="url(#arr)"/>
    <line class="flow" x1="830" y1="268" x2="830" y2="186" stroke="#b39dff" stroke-width="2" marker-end="url(#arr)"/>
    <text x="842" y="232" font-size="12.5" fill="#8b949e" font-style="italic">implements interfaces</text>
    <path class="flow" d="M770 350 C770 372 640 366 640 392" fill="none" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#arrT)"/>
    <line class="flow" x1="830" y1="350" x2="830" y2="392" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#arrT)"/>
    <path class="flow" d="M890 350 C890 372 1020 366 1020 392" fill="none" stroke="#2dd4bf" stroke-width="1.8" marker-end="url(#arrT)"/>

    <!-- layer boxes -->
    <g>
      <rect class="box" x="520" y="96" width="172" height="88" rx="14" stroke="#7dd3fc"/>
      <text class="ttl" x="540" y="132">Api</text>
      <text class="sub" x="540" y="158">endpoints · docs</text>
    </g>
    <g>
      <rect class="box" x="736" y="96" width="182" height="88" rx="14" stroke="#b39dff"/>
      <text class="ttl" x="756" y="132">Application</text>
      <text class="sub" x="756" y="158">use cases · validation</text>
    </g>
    <g>
      <rect class="box" x="962" y="96" width="182" height="88" rx="14" stroke="#fbbf24"/>
      <text class="ttl" x="982" y="132">Domain</text>
      <text class="sub" x="982" y="158">Trip · Itinerary · rules</text>
    </g>
    <g>
      <rect class="box" x="720" y="270" width="220" height="80" rx="14" stroke="#2dd4bf"/>
      <text class="ttl" x="740" y="304">Infrastructure</text>
      <text class="sub" x="740" y="329">adapters to the outside world</text>
    </g>

    <!-- external services -->
    <g>
      <rect class="chip" x="548" y="394" width="184" height="50" rx="12"/>
      <text x="640" y="415" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">Semantic Kernel</text>
      <text x="640" y="434" font-size="12.5" fill="#8b949e" text-anchor="middle">LLM via Groq</text>
    </g>
    <g>
      <rect class="chip" x="748" y="394" width="164" height="50" rx="12"/>
      <text x="830" y="415" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">Foursquare</text>
      <text x="830" y="434" font-size="12.5" fill="#8b949e" text-anchor="middle">places data</text>
    </g>
    <g>
      <rect class="chip" x="928" y="394" width="184" height="50" rx="12"/>
      <text x="1020" y="415" font-size="14" font-weight="600" fill="#f0f6fc" text-anchor="middle">SQL Server</text>
      <text x="1020" y="434" font-size="12.5" fill="#8b949e" text-anchor="middle">via EF Core</text>
    </g>
  </g>

  <text class="sans" x="1144" y="70" font-size="14" fill="#b39dff" text-anchor="end">View repo →</text>
</svg>
